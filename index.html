<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EU NUTS3 Map</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Your CSS (cacheable) -->
  <link rel="stylesheet" href="assets/css/map.css?v=3" />

  <!-- Start pulling data as soon as the HTML parses -->
<link rel="preload" as="fetch" href="assets/data/nuts3-copy.geojson" crossorigin>
<link rel="preload" as="fetch" href="assets/data/nuts3-data.csv" crossorigin>

<!-- Small boost for the CDNs -->
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">

</head>
<body>
  <!-- Namespace all UI to avoid CSS collisions -->
  <div class="map-app">
    <div class="dash-grid">
      <!-- Left panel (title + filters + hover info) -->
      <aside id="side-panel" class="map-side" aria-label="Dashboard filters">
        <h1 class="panel-title">Project Tempo European Dashboard</h1>

        <!-- Filters live INSIDE the panel -->
        <section id="filters" class="panel-section">
          <label for="measure-select">Select Indicator</label>
          <select id="measure-select" class="js-map-select" aria-label="Select Indicator">
            <option value="forgottenVoters">Forgotten Voters Share (%)</option>
            <option value="willingnessPay">Willingness to Pay for Climate Action (%)</option>
            <option value="renewableSupport">Renewable Energy Support (%)</option>
          </select>

          <label for="level-select">Geography Level</label>
          <select id="level-select" class="js-map-select" aria-label="Geography Level">
            <option value="3" selected>Finer level (NUTS3)</option>
            <option value="0">Country</option>
          </select>
        </section>

        <section id="filters-country" class="panel-section">
          <label for="country-select">Select Country</label>
          <select id="country-select" class="js-map-select" aria-label="Select Country">
            <option value="__all__">All countries</option>
          </select>
        </section>

        <!-- Legend -->
        <section class="panel-section" id="legend-container" aria-live="polite">
          <div id="legend" class="legend">
            <!-- JS fills this -->
          </div>
        </section>

        <!-- Hover info -->
        <section id="hover-info" class="panel-section" aria-live="polite">
          Hover over a region
        </section>

        <section class="panel-section panel-brand">
  
          <img
    src="assets/img/company-logo.svg"
    alt="Company logo"
    class="brand-logo"
    height="36"
  />

  <a href="https://projecttempo.com/" target="_blank" rel="noopener">
    <img
      src="assets/img/qrcode.svg"
      alt="QR code linking to client website"
      class="qr-img"
      width="100" height="100"
      loading="lazy"
      decoding="async"
    />
  </a>

  
</section>

      </aside>

      <!-- Right column: map + search UI -->
      <div class="map-wrap">
        <div id="map" role="region" aria-label="Interactive map of EU NUTS3 regions"></div>

        <!-- Search (bottom-right on the map) -->
        <div id="search-region">
          <input
            id="region-search"
            class="map-ui-input"
            placeholder="Type to search"
            autocomplete="off"
          />
        </div>

        <!-- Custom autocomplete dropdown -->
        <div id="region-ac" role="listbox" aria-label="Regions"></div>
      </div> <!-- /.map-wrap -->
    </div> <!-- /.dash-grid -->
  </div> <!-- /.map-app -->

  <!-- Vendor JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Your JS (deferred so DOM is parsed first) -->
  <script src="assets/js/map.js" defer></script>
</body>
</html>
